
services:
  db:
    image: postgres:16-alpine
    container_name: reservation-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USR}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: reservation-app-db
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USR} -d reservation-app-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile
    container_name: reservation-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USR}:${DATABASE_PASS}@db:5432/reservation-app-db
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge